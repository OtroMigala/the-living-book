# Pulls the published content from Contentstack, builds the site and publishes it to GitHub Pages,
# on every push to main and on demand (hosting decided at the Stage 2 gate). It runs the full
# `npm run ci` before publishing: a commit or a content change that fails any check is never
# published. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent when content is published in Contentstack (F05; the webhook is set up in Stage 5).
  repository_dispatch:
    types: [contentstack-publish]

# Minimum permissions: read the code, publish to Pages, and prove with OIDC (id-token) that the
# deployment comes from this repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling one that is half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A ceiling for a hung step, not the budget (BC6 is 5 min): room for three browser installs.
    timeout-minutes: 15
    # One job inside the github-pages environment: that is where the Contentstack secrets live.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Falls back to the committed snapshot if Contentstack is unreachable or not seeded (K02).
      - name: Pull content from Contentstack
        run: npm run cms:pull
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.CONTENTSTACK_DELIVERY_TOKEN }}
          CONTENTSTACK_ENVIRONMENT: production
      # Before `npm run ci`: its build paginates the book in Firefox (ADR 0009). Three tries of 150 s:
      # Ubuntu's mirror hung for ten minutes three times on 2026-10-22 (normally 40–47 s).
      - name: Install browsers
        run: |
          for try in 1 2 3; do
            timeout 150 npx playwright install --with-deps chromium firefox webkit && exit 0
            echo "::warning::installing the browsers failed or timed out (try $try of 3)"
          done
          exit 1
      # Format, lint, types, tests (including the pulled content), specs, versions, build, budgets.
      - run: npm run ci
      # The browser tests run on the pulled content too: nothing is published that they reject.
      - run: npm run e2e
      # The real token values, searched for byte by byte in the repository and in dist/ (C05).
      # Given to this step only; the scan prints where a value was found, never the value.
      - name: Secret scan with the real values
        run: npm run check:secrets
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.CONTENTSTACK_DELIVERY_TOKEN }}
          CONTENTSTACK_MANAGEMENT_TOKEN: ${{ secrets.CONTENTSTACK_MANAGEMENT_TOKEN }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
