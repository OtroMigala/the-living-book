# Pulls the published content from Contentstack, builds the site and publishes it to GitHub Pages,
# on every push to main and on demand (hosting decided at the Stage 2 gate). It runs the full
# `npm run ci` before publishing: a commit or a content change that fails any check is never
# published. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
  # Also started by the Content watch workflow when something is published in Contentstack (F05).
  workflow_dispatch:
  # For a webhook relay, if one ever replaces the scheduled check (ADR 0011, option 2).
  repository_dispatch:
    types: [contentstack-publish]

# Minimum permissions: read the code, publish to Pages, and prove with OIDC (id-token) that the
# deployment comes from this repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling one that is half published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The public site, built from the content published in Contentstack, and every check on it.
  # The browser tests then run in jobs side by side, as in CI: in this one job they took 11 min 50 s
  # with the scene around the book, and the deploy 13 min 6 s, over BC5's 10 min (Stage 6).
  build:
    runs-on: ubuntu-latest
    # Playwright's image, with the browsers in it (ADR 0010); the same as the CI's jobs.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    # A ceiling for a hung step, not the budget (BC5: publish to live within 10 min).
    timeout-minutes: 10
    # Inside the github-pages environment: that is where the Contentstack secrets live.
    environment: github-pages
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # F05, F06 (ADR 0011): the signatures of what is published in production and in preview,
      # taken before the pulls, so a publish during this run leaves the site older than Contentstack
      # and the next check deploys again.
      - name: Content version
        run: npm run --silent cms:version > "$RUNNER_TEMP/content-version.json"
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.CONTENTSTACK_DELIVERY_TOKEN }}
          WITH_PREVIEW: 'true'
      # Falls back to the committed snapshot if Contentstack is unreachable or not seeded (K02).
      - name: Pull content from Contentstack
        run: npm run cms:pull
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.CONTENTSTACK_DELIVERY_TOKEN }}
          CONTENTSTACK_ENVIRONMENT: production
      # Format, lint, types, tests (including the pulled content), specs, versions, build, budgets.
      - run: npm run ci
      # The site as built, for the browser tests and then for publishing: the same bytes. The
      # content's signatures go with it, outside dist until the site is published.
      - name: The content's signatures beside the site
        run: cp "$RUNNER_TEMP/content-version.json" content-version.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: |
            dist
            content-version.json
          retention-days: 1

  # The browser tests run on the site built from the pulled content: nothing is published that
  # they reject. The same jobs as CI's (ci.yml), on the built site instead of a build of their own.
  browsers:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: chromium-1
            projects: --project=chromium --shard=1/2
          - key: chromium-2
            projects: --project=chromium --shard=2/2
          - key: firefox-webkit
            projects: --project=firefox --project=webkit
          - key: phone-cross-engine
            projects: --project=pova6
            then: --project=cross-engine --no-deps
    name: browsers (${{ matrix.key }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
      - name: Browser tests
        run: npx playwright test ${{ matrix.projects }}
      - name: Browser tests, then
        if: ${{ matrix.then }}
        run: npx playwright test ${{ matrix.then }}
      - name: Browser test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report-${{ matrix.key }}
          path: playwright-report
          retention-days: 14

  # Publishes the site that passed every check, with its preview copy.
  publish:
    needs: [build, browsers]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
      # F06 (ADR 0011): the preview copy at /preview/, from Contentstack's preview environment,
      # built after the public site has passed every check. Its content may be unfinished: if it
      # fails to pull or to build, the public site goes out without a preview rather than not at all.
      # Only if the delivery token can read the preview environment (its signature is not null).
      - name: Can the preview be read?
        id: preview-readable
        run: |
          if grep -q '"preview":{"signature":"' content-version.json; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the preview environment could not be read; no preview copy"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Preview content
        id: preview-pull
        if: steps.preview-readable.outputs.yes == 'true'
        continue-on-error: true
        run: npm run cms:pull
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.CONTENTSTACK_DELIVERY_TOKEN }}
          CONTENTSTACK_ENVIRONMENT: preview
      - name: Preview copy
        id: preview-build
        if: steps.preview-pull.outcome == 'success'
        continue-on-error: true
        run: npm run build:preview && npm run check:preview
      - name: No preview copy if it failed
        if: steps.preview-build.outcome != 'success'
        run: |
          rm -rf dist/preview
          echo "::warning::the preview copy was not built; the public site goes out without it"
      # The real token values, searched for byte by byte in the repository and in dist/ (C05).
      # Given to this step only; the scan prints where a value was found, never the value.
      - name: Secret scan with the real values
        run: npm run check:secrets
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.CONTENTSTACK_API_KEY }}
          CONTENTSTACK_DELIVERY_TOKEN: ${{ secrets.CONTENTSTACK_DELIVERY_TOKEN }}
          CONTENTSTACK_MANAGEMENT_TOKEN: ${{ secrets.CONTENTSTACK_MANAGEMENT_TOKEN }}
      # During GitHub's incident of 2026-10-22, runs started up to an hour late, after newer
      # commits had been published. A late run still checks everything, but publishes only if its
      # commit is still the newest on main, so the site never goes back to an older version.
      - name: Is this still the newest commit on main?
        id: newest
        run: |
          git fetch --quiet --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on since this commit; checked, not published"
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi
      # The content's signature goes with the site, for the scheduled check to compare (F05).
      - name: Content version into the site
        if: steps.newest.outputs.yes == 'true'
        run: cp content-version.json dist/content-version.json
      - uses: actions/configure-pages@v6.0.0
        if: steps.newest.outputs.yes == 'true'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: steps.newest.outputs.yes == 'true'
        with:
          path: dist
      - id: deployment
        if: steps.newest.outputs.yes == 'true'
        uses: actions/deploy-pages@v5.0.1
