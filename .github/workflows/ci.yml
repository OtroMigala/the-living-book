# Runs the same checks as `npm run ci`, one step each, so the log shows which check failed and how
# long each one took (evidence for H6 in workflow-playbook-v0.md). See docs/adr/0001.
# Triggers: every push to main, every pull request, and by hand from the Actions tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Playwright's image, with the browsers and their system packages in it (ADR 0010): nothing is
    # installed from Ubuntu's mirror, which hung in 8 jobs on 2026-10-22. The tag must be the
    # version of @playwright/test, pinned by digest (`npm run check:deps` checks both). Run as the
    # runner's user, which owns the workspace, as Playwright's documentation shows.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    # A ceiling for a hung step, not the budget (BC6 is 5 min).
    timeout-minutes: 10
    steps:
      # Actions pinned to exact versions, like npm dependencies (C04).
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and lint
        run: npx biome ci .
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Spec traceability
        run: npm run check:specs
      - name: Exact dependency versions
        run: npm run check:deps
      - name: License policy
        run: npm run check:licenses
      - name: Model contract
        run: npm run check:model
      # The build paginates the book in Firefox (ADR 0009), from the image like every browser.
      - name: Build
        run: npm run build
      - name: Byte budgets
        run: npm run check:budgets
      # No secrets in this workflow, so the scan looks for token shapes only.
      - name: Secret scan
        run: npm run check:secrets
      # Real browsers against the built site: reading without JavaScript, the language switch,
      # titles. Chromium, Firefox, WebKit and the reference phone (playwright.config.ts).
      - name: Browser tests
        run: npm run e2e
      # The HTML report, downloadable from the run's page (Artifacts), pass or fail.
      - name: Browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Q01 AC1: Lighthouse on the built site, three runs per page and tier, the medians against
  # BL1–BL3 (specs/02-budget.md). A job of its own, beside the checks rather than after them, so
  # the run's wall time stays within BC6.
  lighthouse:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --user 1001
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Firefox paginates the book during the build (ADR 0009); Chromium runs Lighthouse.
      - name: Build
        run: npm run build
      - name: Lighthouse
        run: npm run check:lighthouse
      # Every run's HTML report, downloadable from the run's page (Artifacts), pass or fail.
      - name: Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 14
