# Runs the same checks as `npm run ci`, one step each, so the log shows which check failed and how
# long each one took (evidence for H6 in workflow-playbook-v0.md). See docs/adr/0001.
# Triggers: every push to main, every pull request, and by hand from the Actions tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to exact versions, like npm dependencies (C04).
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format and lint
        run: npx biome ci .
      - name: Types
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Spec traceability
        run: npm run check:specs
      - name: Exact dependency versions
        run: npm run check:deps
      - name: Build
        run: npm run build
      - name: Byte budgets
        run: npm run check:budgets
      # Real browsers against the built site: reading without JavaScript, the language switch,
      # titles. Chromium, Firefox, WebKit and the reference phone (playwright.config.ts).
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: npm run e2e
      # The HTML report, downloadable from the run's page (Artifacts), pass or fail.
      - name: Browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
